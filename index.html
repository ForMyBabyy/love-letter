<!DOCTYPE html>
<html>
<head>
    <title>A Little Message for You ❤️</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(#090b2a, #1b1645, #3b1d52);
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            overflow: hidden;
        }

        .stars {
            font-size: 20px;
            letter-spacing: 25px;
            line-height: 60px;
            opacity: 0.8;
        }

        .container {
            margin-top: 100px;
            padding: 20px;
        }

        .moon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            color: #eee;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 28px;
            background-color: #e98bb5;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 17px;
        }

        .button:hover {
            background-color: #d96a9d;
        }

        .heart {
            position: absolute;
            font-size: 20px;
            animation: float 5s infinite;
        }

        .heart1 {
            left: 15%;
            bottom: 10%;
        }

        .heart2 {
            right: 15%;
            bottom: 20%;
            animation-delay: 2s;
        }

        .heart3 {
            left: 70%;
            bottom: 5%;
            animation-delay: 1s;
        }

        @keyframes float {
            0% {
                transform: translateY(0);
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                transform: translateY(-300px);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="stars">
        ✦　⋆　✧　✦　⋆　✧　✦
    </div>

    <div class="container">

        <div class="moon">
            🌙
        </div>

        <h1>Hey, Baby... ❤️</h1>

        <p>
            I made something for you.
        </p>

        <p>
            It's just a little message<br>
            from my heart to yours. 🥺
        </p>

        <a class="button" href="message.html">
            Tap to open ♡
        </a>

    </div>

    <div class="heart heart1">❤️</div>
    <div class="heart heart2">💕</div>
    <div class="heart heart3">💗</div>

</body>
</html>
